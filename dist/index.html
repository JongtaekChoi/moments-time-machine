<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10233f" />
    <meta name="description" content="아이와 부모가 반복되는 일상 속에서 다시 시도한 흔적을 남기는 짧은 감정 어드벤처" />
    <title>마음의 타임머신 — 또 깜빡했어</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-live="polite">
      <header class="topbar">
        <a class="brand" href="./" aria-label="처음으로">마음의 <strong>타임머신</strong></a>
        <div class="chapter-label" id="chapterLabel">CH. 01 · 또 깜빡했어</div>
        <button class="quiet-button" id="restart" type="button">이번 월요일 처음부터</button>
      </header>

      <section class="scene" id="scene">
        <div class="scene-image" aria-hidden="true"></div>
        <div class="scene-vignette" aria-hidden="true"></div>
        <div class="scene-copy">
          <p class="role-tag" id="roleTag"></p>
          <p class="eyebrow" id="eyebrow"></p>
          <h1 id="title"></h1>
          <p class="narration" id="narration"></p>
        </div>
      </section>

      <section class="dialogue-panel" aria-label="이야기 선택">
        <div class="speaker" id="speaker"></div>
        <p class="line" id="line"></p>
        <div class="choices" id="choices"></div>
        <p class="hint" id="hint"></p>
      </section>

      <section class="keepsake-board" id="keepsakeBoard" hidden aria-label="우리 집에 남은 것">
        <div>
          <p class="eyebrow">우리 집에 남은 것</p>
          <h2>다음 월요일에도 보일 작은 흔적</h2>
          <p>점수도, 정답도 아니에요. 오늘 함께 남긴 방법이에요.</p>
        </div>
        <div class="keepsake-items" id="keepsakeItems"></div>
        <button class="quiet-button clear-button" id="clearKeepsakes" type="button">흔적 선반 비우기</button>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
